- component_name: ComposioAPIComponent
  agent_summary: |-
    You help the user connect an agent to the full Composio toolset, producing a tools output by selecting any supported app and specifying which actions to expose. Use this when you need to wire up a service that does not have its own dedicated Composio component, or when you want a single component to handle tool selection dynamically at runtime. Prefer over the service-specific Composio components when the target integration is not listed as a named peer, or when you need to switch between multiple apps without swapping components.
  agent_usage_notes: |-
    ## What it does
    Connects to the Composio toolset and exposes a set of third-party integration actions (e.g. GitHub, Slack, Gmail) that an agent can invoke at runtime. It wraps the selected actions as callable tools ready for use in an agent pipeline.

    ## Inputs to ask about
    - **tool_name** - Ask the user which Composio integration (app) they want to connect to, e.g. `GITHUB`, `SLACK`, or `GMAIL`. Refer them to the [Composio app list](https://docs.composio.dev) if they are unsure of the exact name.
    - **actions** - Ask the user which specific actions within that tool they want to enable, e.g. `GITHUB_CREATE_ISSUE` or `SLACK_SEND_MESSAGE`. Multiple actions can be added; leave empty to expose all available actions for the selected tool.

    ## Outputs
    - **tools** - A list of callable tool objects ready to be passed into an agent component (e.g. a LangChain or OpenAI agent node) as its tools input.

    ## Notes
    - The `api_key` input is a required credential — make sure the user has created it as a Composio secret variable before wiring up this component; direct them to https://docs.composio.dev/faq/api_key/api_key if needed.
    - The selected `tool_name` integration must already be **connected and authenticated** in the user's Composio dashboard; otherwise action calls will fail at runtime.
    - `actions` names are case-sensitive and follow the pattern `APPNAME_ACTION_NAME` — advise the user to look them up in the Composio docs or dashboard.
    - This component is typically placed upstream of an agent node, with the **tools** output feeding directly into the agent's tools input.
- component_name: ComposioAgentQLAPIComponent
  agent_summary: |-
    You help the user connect to AgentQL via the Composio toolset, authenticating with an API key and running selected AgentQL actions that return results as a dataframe. It is a good fit when you need to integrate AgentQL's web querying or scraping capabilities into an agent workflow through Composio's managed auth layer. Prefer over the generic Composio Tools component when you want AgentQL-specific action filtering and a dedicated credential configuration rather than a broad multi-tool setup.
  agent_usage_notes: |-
    ## What it does
    Connects to the AgentQL service via Composio, authenticating with the chosen auth method and exposing selected AgentQL actions that can be invoked by an agent or workflow. Results are returned as a DataFrame.

    ## Inputs to ask about
    - **api_key** - Ask the user for their Composio API key, which is required to authenticate with the Composio platform.
    - **auth_mode** - Ask the user which authentication mode to use for AgentQL (e.g., API key, OAuth2, bearer token); the correct choice determines which other credential fields are relevant.
    - **generic_api_key** - If the user selects an API-key-based auth mode, ask for their AgentQL API key to be entered on the Composio connection page.
    - **client_id / client_secret** - If using OAuth2, ask the user for their OAuth app's client ID and secret.
    - **redirect_uri** - If using OAuth2, ask for the redirect URI registered with the OAuth app.
    - **bearer_token** - If using bearer-token auth, ask the user to supply the token directly.
    - **username / password** - If using basic auth, ask for the AgentQL account credentials.
    - **action_button** - Ask the user which AgentQL actions they want to enable; this list determines what the component can do at runtime.

    ## Outputs
    - **dataFrame** - Returns the results of the selected AgentQL action(s) as a DataFrame, suitable for feeding into a data-processing component, table display, or further agent steps.

    ## Notes
    - Only fill in credential fields that match the chosen `auth_mode`; leaving irrelevant credential fields empty avoids confusion.
    - The `action_button` (sortable list) must have at least one action selected, or the component will have nothing to execute.
    - Refer users to https://docs.composio.dev for help locating their API key and setting up OAuth app credentials.
- component_name: ComposioAgiledAPIComponent
  agent_summary: |-
    You help the user connect to the Agiled business management platform via Composio, authenticate with various credential types, execute selected actions, and return results as a dataframe. It is a good fit when your agent needs to interact with Agiled for project, client, or task management within a Composio-powered workflow. Prefer over the generic Composio Tools component when you want a pre-scoped integration targeting Agiled specifically rather than selecting from the full Composio toolset.
  agent_usage_notes: |-
    ## What it does
    The Agiled component connects to the Agiled project management and CRM platform via the Composio integration layer, authenticating with the service and exposing its actions to the rest of the flow. It returns results as a DataFrame for downstream processing.

    ## Inputs to ask about
    - **auth_mode** - Ask the user which authentication method their Agiled connection uses (e.g., API key, OAuth2, bearer token); the correct choice determines which other credential fields are needed.
    - **api_key** - Ask the user for their Composio API key used to access the Composio integration layer; required to connect.
    - **generic_api_key** - Ask the user for their Agiled API key if using API key auth mode; entered on the Composio credentials page.
    - **client_id / client_secret** - Ask the user for these if they are using OAuth2 auth mode.
    - **username / password** - Ask the user for these if using Basic authentication mode.
    - **domain / subdomain / instance_url / base_url** - Ask the user if their Agiled account uses a custom domain or subdomain; leave blank if not applicable.
    - **action_button** - Ask the user which Agiled actions they want to enable; this controls what operations the component exposes.
    - **scopes** - Ask the user which permission scopes are needed if using OAuth2; defaults to whatever Composio pre-selects.

    ## Outputs
    - **dataFrame** - Returns action results from Agiled as a structured DataFrame; commonly feeds into a data processing component, table display, or subsequent agent step.

    ## Notes
    - Only the credential fields relevant to the chosen `auth_mode` need to be filled in — filling unrelated fields will not cause errors but adds unnecessary clutter.
    - Refer the user to https://docs.composio.dev for details on setting up the Agiled integration and obtaining credentials.
- component_name: ComposioAirtableAPIComponent
  agent_summary: |-
    You help the user connect to Airtable via the Composio toolset, authenticate with the service, and execute actions against Airtable bases, returning results as a dataframe. It is a good fit when you need to read from or write to Airtable records inside an automated workflow. Prefer over ComposioGoogleSheetsAPIComponent when the user's structured data lives in Airtable rather than Google Sheets.
  agent_usage_notes: |-
    ## What it does
    Connects to Airtable via the Composio integration layer, authenticates using the chosen auth method, and executes one or more Airtable actions (such as reading or writing records). Results are returned as a DataFrame.

    ## Inputs to ask about
    - **api_key** - Ask the user for their Composio API key, which authorizes this component to use the Composio platform (not the Airtable API key directly).
    - **auth_mode** - Ask the user which authentication method they want to use (e.g., API key, OAuth, bearer token); the correct choice determines which other credential fields are relevant.
    - **generic_api_key** - If using a generic API key auth mode, ask the user to enter the Airtable API key here (as shown on the Composio connection page).
    - **access_token / bearer_token / token** - Ask the user to provide whichever token type matches their chosen auth mode; only one set is typically needed.
    - **action_button** - Ask the user which Airtable action(s) they want to perform (e.g., list records, create record); this drives what the component actually does.

    ## Outputs
    - **dataFrame** - Returns results of the executed Airtable action as a DataFrame; commonly feeds into a data processing component, table display, or downstream agent tool.

