    You help the user connect to the Linear project management API via Composio, executing actions against Linear and returning results as a DataFrame. It is a good fit when you need to automate issue tracking, project, or team workflows in Linear from within a flow. Prefer over Composio Tools (ComposioAPIComponent) when you want a pre-scoped connection specifically to Linear rather than a general multi-tool Composio setup; prefer over Jira when the user's team works in Linear rather than Atlassian's issue tracker.
  agent_usage_notes: |-
    ## What it does
    Connects to the Linear project-management API via Composio, authenticates using a chosen auth method, and returns action results as a DataFrame for downstream processing.

    ## Inputs to ask about
    - **auth_mode** - Ask the user which authentication method they want to use (e.g., API Key, OAuth2, Bearer Token). The correct mode determines which other fields are required.
    - **api_key** - Ask the user for their Composio API key, used to authenticate with the Composio platform itself.
    - **generic_api_key** - If the user selects API Key auth mode, ask them to enter their Linear API key here (entered on the Composio connection page).
    - **access_token** - If using OAuth2 or token-based auth, ask the user for their Linear access token.
    - **bearer_token** - If using Bearer Token auth mode, ask the user to supply their Bearer token.
    - **scopes** - Ask the user which Linear permission scopes are needed (e.g., `read`, `write`, `issues:create`); leave blank if the default Composio scopes are sufficient.
    - **action_button** - Ask the user which Linear actions they want to trigger (e.g., create issue, list teams); this is the primary selector for what the component does.

    ## Outputs
    - **dataFrame** - Returns the result of the selected Linear action(s) as a DataFrame; commonly feeds into a data transformation component, table display, or downstream AI agent.

    ## Notes
    - Most auth fields (OAuth URLs, tokens, credentials) are conditionally relevant — only fill those matching the selected `auth_mode` to avoid conflicts.
    - The `action_button` (sortableList) is critical: without selecting at least one action, the component will not perform any meaningful work.
    - Refer to [Composio docs](https://docs.composio.dev) for supported Linear actions and required scopes.
