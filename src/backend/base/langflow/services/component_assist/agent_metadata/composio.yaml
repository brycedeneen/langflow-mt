    - Only fill credential fields that match the selected `auth_mode`; leaving unrelated fields blank is expected and fine.
    - The `auth_link` field handles OAuth browser-based flows — if the user picks OAuth, they will need to complete a redirect step before the component can run.
    - Refer the user to [Composio docs](https://docs.composio.dev) if they are unsure how to obtain credentials or set up the Airtable integration.
