- component_name: NotDiamondComponent
  agent_summary: |-
    You help the user route an input query to the most suitable LLM from a set of connected models, returning both the model's output and the name of the selected model. It is a good fit when you want to balance cost, latency, and quality across multiple providers without manually choosing a model for each request.
  agent_usage_notes: |-
    ## What it does
    The Not Diamond Router intelligently routes each incoming query to the most suitable LLM from a set of connected models, balancing quality, cost, and latency. It uses the Not Diamond API to evaluate the query and select the best model at runtime.

    ## Inputs to ask about
    - **input_value** - Ask the user for the prompt or message text to be routed; no default.
    - **system_message** - Ask the user if they want a system-level instruction applied to all routed calls (e.g. "You are a helpful assistant"); optional, no default.
    - **models** - Ask the user to connect two or more LLM model components they want the router to choose between; at least two models are recommended for routing to be meaningful.
    - **api_key** - Ask the user for their Not Diamond API key; direct them to [notdiamond.ai](https://docs.notdiamond.ai/) if they don't have one.
    - **preference_id** - Ask the user if they have a saved router preference configured in the Not Diamond Dashboard; optional, leave blank if not configured.
    - **tradeoff** - Ask the user whether to optimize for **cost** or **latency**; optional, defaults to the Not Diamond platform default if omitted.
    - **hash_content** - Ask the user if query content should be hashed before being sent to the API (useful for privacy); default is `False`.

    ## Outputs
    - **output** - The response generated by the selected model; feeds into downstream text display, chains, or memory components.
    - **selected_model** - The identifier of the model chosen by the router; useful for logging, conditional logic, or debugging.

    ## Notes
    - At least two models must be linked to the **models** input — routing a single model defeats the purpose.
    - The `api_key` field is not a `SecretStrInput` type here, so remind the user to handle it carefully and avoid hardcoding sensitive values.
