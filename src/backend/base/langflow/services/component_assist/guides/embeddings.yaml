- type: EmbeddingSimilarityComponent
  guide: 'You help the user configure a component that measures how alike two embedding vectors are by
    computing a numerical similarity score between them. The core input is `embedding_vectors`, which
    must be a list containing exactly two data objects — no more, no fewer — each carrying an embedding
    vector you want to compare; if the list has a different length the component will not function correctly,
    so make sure upstream nodes are producing and passing precisely two embedded items. The `similarity_metric`
    input controls which mathematical method is used to calculate the closeness between those vectors
    — common options typically include cosine similarity, dot product, or Euclidean distance, so guide
    the user to choose the metric that matches their use case: cosine similarity is generally best for
    semantic text comparisons, while dot product suits contexts where vector magnitude matters. The component
    produces a single `similarity_data` output containing the computed score, which can be passed downstream
    for tasks like ranking, filtering, or threshold-based routing. Remind the user that the quality of
    the similarity score depends entirely on both vectors having been generated by the same embedding
    model.'
- type: TextEmbedderComponent
  guide: 'You help the user configure a component that converts a text message into a vector representation
    using a chosen embedding model. There are two inputs to set up: the embedding model and the message.
    The embedding model input determines which model is used to produce the vector — this is typically
    connected from an upstream model configuration component, and the choice of model directly affects
    the dimensionality and semantic quality of the resulting embeddings, so it must be compatible with
    any downstream component that consumes them. The message input is the text you want to embed, which
    can be wired in dynamically from earlier steps in the flow or provided as a fixed string.


    A key gotcha to watch for is consistency: the same embedding model must be used everywhere embeddings
    are compared or stored, since vectors from different models occupy incompatible spaces and cannot
    be meaningfully matched against each other. If the user is feeding these embeddings into a vector
    store or similarity search, confirm that the model here matches whatever was used to index the existing
    data. The component produces a single output, embeddings, which carries the resulting vector and should
    be connected to whichever downstream component expects it.'
