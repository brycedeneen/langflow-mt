- type: ADPAPIRequestComponent
  guide: 'This component makes authenticated REST calls to ADP APIs using a connection object produced by an ADP Auth component,
    handling mutual TLS and Bearer token authentication automatically. You help the user wire the correct inputs together
    so the right data comes back.


    Start by connecting an ADP Auth component''s output to the connection input — nothing works without it. Choose a predefined
    endpoint from the endpoint dropdown, or select "Other" and supply a custom path like `/hr/v2/workers` in custom_path.
    Leave resource_id empty when you want a list of records, or set it to a specific worker ID for a single-record lookup.
    Use query_params to pass OData options such as `$filter` or `$select` to narrow results. For non-GET methods, provide
    a JSON body via the body input. The result_mode input controls pagination: "Top 20" returns one page and is useful for
    testing, while "All" auto-paginates to retrieve every record — warn the user this can be slow or expensive on large datasets.
    Adjust timeout if requests are timing out on large or slow responses. The component outputs a single data value containing
    the API response.'
- type: ADPAuthComponent
  guide: 'You help the user configure a connection to ADP''s API using OAuth 2.0 client credentials authenticated over mutual
    TLS (mTLS). When setting this up, the user must supply all five inputs: the `client_id` and `client_secret` issued from
    their ADP developer account, and a matched certificate/key pair for mTLS — `cert_pem` holds the client certificate and
    `key_pem` holds its corresponding private key. Both PEM fields accept either pasted text or an uploaded file (.pem/.crt
    for the certificate, .pem/.key for the key); both are stored encrypted at rest, so they are safe to commit to the flow.
    The `token_url` field is pre-configured for ADP''s production token endpoint and should only be changed when targeting
    a staging or sandbox environment. The component outputs a single `connection` object that downstream components use to
    make authenticated ADP API calls — nothing will work without a valid connection, so make sure the certificate and key
    are a matched pair and that the client ID and secret belong to the same ADP application that generated the certificate.
    Mismatched credentials or an expired certificate are the most common sources of authentication failure here.'
- type: ADPMCPComponent
  guide: 'You help the user configure a bridge that connects to ADP''s MCP server and makes its tools available to a downstream
    Agent component. The primary input is the connection object, which carries the credentials and default server URL needed
    to reach ADP''s MCP endpoint — this should be wired in from a dedicated connection component. If the user needs to point
    to a non-default ADP MCP URL, they can override it using the mcp_url field without modifying the connection itself.


    Once the connection is established, the component exposes all available ADP tools by default. If the user wants to limit
    which tools the Agent can see — for example, to reduce noise or restrict capabilities — they should populate tool_filter
    with a comma-separated list of exact tool names. Any tool not listed will be hidden from the Agent. Leave this field blank
    to pass through the full set. Keep in mind that tool names must match exactly what ADP''s MCP server advertises; typos
    or incorrect names will silently exclude the intended tools, so verify names against the server''s actual tool list before
    filtering.'
- type: ADPTriggerComponent
  guide: You help the user configure a trigger component that listens for incoming ADP event payloads delivered via HTTP POST
    and passes matching events downstream in the flow. The most important input to configure is `event_types` — use it to
    specify which ADP event categories this trigger should react to; any incoming event whose type does not match your selection
    will be silently ignored, so make sure you include every type you want the flow to process. The `endpoint` input defines
    where ADP should send its POST requests, and the `api_key` is auto-generated — you must copy this value and provide it
    as the `x-api-key` header when configuring the webhook on the ADP side, otherwise incoming requests will be rejected.
    The `data` input receives the raw event payload and does not require manual configuration; it is populated automatically
    when ADP posts to the endpoint. Remind the user that if events appear to go unprocessed, the first things to check are
    whether the correct event types are selected and whether the API key in the ADP webhook settings exactly matches the generated
    value shown here.
