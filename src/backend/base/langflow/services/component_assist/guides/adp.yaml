- type: ADPAPIRequestComponent
  guide: 'This component makes authenticated REST calls to ADP APIs using a connection object produced
    by an ADP Auth component, handling mutual TLS and Bearer token authentication automatically. You help
    the user wire the correct inputs together so the right data comes back.


    Start by connecting an ADP Auth component''s output to the connection input — nothing works without
    it. Choose a predefined endpoint from the endpoint dropdown, or select "Other" and supply a custom
    path like `/hr/v2/workers` in custom_path. Leave resource_id empty when you want a list of records,
    or set it to a specific worker ID for a single-record lookup. Use query_params to pass OData options
    such as `$filter` or `$select` to narrow results. For non-GET methods, provide a JSON body via the
    body input. The result_mode input controls pagination: "Top 20" returns one page and is useful for
    testing, while "All" auto-paginates to retrieve every record — warn the user this can be slow or expensive
    on large datasets. Adjust timeout if requests are timing out on large or slow responses. The component
    outputs a single data value containing the API response.'
- type: ADPApplicantOnboardingToolsComponent
  guide: 'This component exposes a single agent tool that initiates the ADP Workforce Now applicant onboarding
    process by calling the underlying POST endpoint, triggering hire paperwork and payroll setup for a
    new employee. You help the user connect it correctly and understand the consequences of enabling it.


    The `connection` input must be wired from an ADP Auth component — without a valid authenticated connection
    the tool cannot make any API calls. The `enable_mutations` toggle is the critical control here: it
    defaults to off deliberately, because triggering onboarding is not a reversible lookup — it creates
    an applicant record and immediately kicks off downstream processes like hire paperwork and payroll
    enrollment. Only switch this on when the user''s agent is genuinely ready to perform real onboarding
    actions, not during testing or prototyping. Once enabled, the tool accepts structured arguments covering
    US, Canadian, and International onboarding templates, and also supports an `additional_fields` escape
    hatch for things like tax profiles, workers-comp configuration, custom fields, and state-specific
    extensions. Remind the user that any fields passed through `additional_fields` should conform to what
    ADP WFN''s applicant-onboarding v2 schema actually accepts, since there is no client-side validation
    on that bag of extra data.'
- type: ADPAuthComponent
  guide: 'You help the user configure a connection to ADP''s API using OAuth 2.0 client credentials authenticated
    over mutual TLS (mTLS). When setting this up, the user must supply all five inputs: the `client_id`
    and `client_secret` issued from their ADP developer account, and a matched certificate/key pair for
    mTLS — `cert_pem` holds the client certificate and `key_pem` holds its corresponding private key.
    Both PEM fields accept either pasted text or an uploaded file (.pem/.crt for the certificate, .pem/.key
    for the key); both are stored encrypted at rest, so they are safe to commit to the flow. The `token_url`
    field is pre-configured for ADP''s production token endpoint and should only be changed when targeting
    a staging or sandbox environment. The component outputs a single `connection` object that downstream
    components use to make authenticated ADP API calls — nothing will work without a valid connection,
    so make sure the certificate and key are a matched pair and that the client ID and secret belong to
    the same ADP application that generated the certificate. Mismatched credentials or an expired certificate
    are the most common sources of authentication failure here.'
- type: ADPBenefitsToolsComponent
  guide: This component exposes ADP Workforce Now benefits data as callable tools that a downstream agent
    or chain can invoke — covering beneficiaries (read), dependents (read), and external plans (read/write).
    The only required input is a valid connection object produced by an ADP Auth component upstream; without
    it, none of the tools will be able to authenticate against ADP's API. By default, the component surfaces
    only read operations, so if your flow needs to create or modify external-plan records, you must explicitly
    toggle enable_mutations to true — this gates the write tools as an intentional safeguard, since external-plans
    payloads are passed through to ADP exactly as constructed, with no validation layer in between. That
    free-form pass-through means the correctness of any write request body is entirely your responsibility;
    consult ADP's partner documentation to ensure the payload structure matches what their API expects.
    The component's single output is a tools bundle ready to be wired into a tool-calling agent or similar
    component.
- type: ADPDataCollectionEntriesToolsComponent
  guide: 'This component exposes tools that interact with ADP Workforce Now''s time and data-collection-entries
    API (v1), letting a downstream agent fire the `data-collection-entries.process` event and retrieve
    results by event ID. You help the user wire up two inputs: `connection`, which must come from an ADP
    Auth component earlier in the flow and carries the authenticated session needed to reach the ADP API,
    and `enable_mutations`, a toggle that is off by default and must be explicitly switched on before
    the process-event tool becomes available to the agent. If the user only needs to read or poll for
    existing event results, they can leave `enable_mutations` off and the component will still expose
    the fetch-by-event-ID tool. Only turn `enable_mutations` on when the user intentionally wants the
    agent to trigger data-collection processing, since firing that event modifies ADP data and cannot
    be undone through this component. Make sure the `connection` input is always provided; without a valid
    ADP Auth connection the tools will have no credentials and all calls will fail.'
- type: ADPDeductionConfigurationsToolsComponent
  guide: 'This component exposes a single read tool, `get_deduction_configurations`, that fetches the
    client''s full deduction-configuration catalog from ADP Workforce Now — including deduction codes,
    categories, and related metadata — which you can then join against per-worker deduction instructions
    elsewhere in the flow.


    The only input you need to configure is the connection, which must come from an ADP Auth component
    earlier in the flow; without a valid authenticated connection the tool will have nothing to call.
    Because this component produces a tools output rather than data directly, it is meant to be wired
    into an agent or tool-runner node that will invoke `get_deduction_configurations` at runtime — not
    into a data-transformation step. Keep in mind that this is strictly a read operation against the v3
    deduction-configurations endpoint, so it returns catalog-level setup data shared across the client,
    not individual worker deduction amounts or frequencies. If the downstream logic requires worker-specific
    deduction details, you will need a separate component to supply that per-worker data and then join
    it to the catalog results this tool returns.'
- type: ADPJobApplicantsToolsComponent
  guide: 'This component exposes write-capable tools for managing applicant screening within ADP Workforce
    Now''s staffing API, specifically designed for screening-agency vendor integrations. You help the
    user connect it to an active ADP Auth component via the `connection` input — without a valid connection,
    no tools will function. The `enable_mutations` toggle is the critical gate here: it is off by default
    because both available tools (`manage_applicant_screening` and `publish_screening_packages`) perform
    write operations against ADP''s live staffing records. Only turn this on when the agent is genuinely
    acting as a screening-agency integration that needs to initiate or update screening and assessment
    statuses, or publish and modify screening packages for one or more applicants. Leaving it off is the
    safe default for any flow where read-only behavior is expected or where the ADP environment is not
    yet confirmed as a production-ready target. Be sure the user understands that enabling mutations in
    a test flow pointed at a live ADP tenant will alter real staffing records, and there is no built-in
    dry-run or preview mode inferable from the available inputs.'
- type: ADPJobRequisitionsToolsComponent
  guide: 'You help the user configure a read-only integration with ADP Workforce Now that exposes job
    requisition data as a callable tool within their flow. The single required input is a connection object
    — this must come from an upstream ADP Auth component, so make sure that component is present and wired
    correctly before this one; no raw credentials or tokens are accepted here.


    The component produces a tools output, meaning downstream nodes (typically an agent or LLM orchestrator)
    can invoke `get_job_requisitions` at runtime. That function can either list all requisitions — optionally
    narrowed using OData-style `$filter`, `$skip`, and `$top` parameters for filtering and pagination
    — or fetch a single requisition when given a specific ID. Because this is a read-only tool, it cannot
    create, update, or delete requisitions. There are no additional configuration inputs beyond the connection,
    so if the user needs to restrict which requisitions are visible or how many are returned by default,
    that control lives in the query parameters passed at invocation time by the agent, not in this component
    itself.'
- type: ADPMCPComponent
  guide: 'You help the user configure a bridge that connects to ADP''s MCP server and makes its tools
    available to a downstream Agent component. The primary input is the connection object, which carries
    the credentials and default server URL needed to reach ADP''s MCP endpoint — this should be wired
    in from a dedicated connection component. If the user needs to point to a non-default ADP MCP URL,
    they can override it using the mcp_url field without modifying the connection itself.


    Once the connection is established, the component exposes all available ADP tools by default. If the
    user wants to limit which tools the Agent can see — for example, to reduce noise or restrict capabilities
    — they should populate tool_filter with a comma-separated list of exact tool names. Any tool not listed
    will be hidden from the Agent. Leave this field blank to pass through the full set. Keep in mind that
    tool names must match exactly what ADP''s MCP server advertises; typos or incorrect names will silently
    exclude the intended tools, so verify names against the server''s actual tool list before filtering.'
- type: ADPPayDataInputToolsComponent
  guide: 'This component equips an AI agent with tools to submit payroll data changes to ADP Workforce
    Now — specifically earnings, deductions, memos, reportable earnings or benefits, and tax-frequency
    overrides, all scoped to a single worker and pay number. You help the user connect it properly and
    decide when to unlock write access.


    The `connection` input must receive the output of an ADP Auth component; without a valid connection
    the tools cannot reach ADP''s API. The `enable_mutations` toggle is the critical control here — it
    defaults to off deliberately, because submitting pay-data-input events directly modifies a live pay
    run and mistakes are difficult to reverse. Only turn it on when the surrounding flow is explicitly
    designed to write payroll data, not merely read or preview it. If the user is building a reporting
    or auditing flow, `enable_mutations` should stay off. When it is off, the component produces no active
    submission tools, so the agent cannot accidentally trigger payroll changes. Remind the user that this
    toggle is the sole gate between a safe, read-oriented flow and one that can alter employee compensation
    records.'
- type: ADPPayDistributionsToolsComponent
  guide: 'This component exposes tools that let an agent read and modify a worker''s direct-deposit (pay
    distribution) records in ADP Workforce Now via the payroll/pay-distributions v2 API. The `connection`
    input must be wired from an ADP Auth component — without a valid connection the tools cannot authenticate
    against ADP. The `enable_mutations` toggle controls whether the change tool is available to the agent;
    leave it off when the flow only needs to look up distribution data using `get_worker_pay_distributions`.
    Turn it on only when the flow is explicitly designed to add, update, inactivate, or remove direct-deposit
    distributions, because these changes affect how workers receive their pay and can be difficult to
    reverse.


    Keep in mind that `enable_mutations` is off by default for good reason — exposing `change_worker_pay_distributions`
    to an agent gives it the ability to act on an instructions array covering the full range of add, update,
    inactivate, and remove-all operations in a single call, making mistakes high-impact. Before enabling
    mutations, confirm the flow has appropriate guardrails such as human review steps or tightly scoped
    agent instructions. The component produces a `tools` output that you connect to an agent component;
    no direct-deposit logic runs here — it only assembles and gates the available tool definitions.'
- type: ADPPayStatementsToolsComponent
  guide: 'This component exposes two read-only ADP Workforce Now payroll tools that downstream agents
    or chains can call: one to list or fetch pay statement records for a worker, and one to retrieve the
    rendered statement file (PDF, PNG, or JPG) as a base64-encoded byte string. The single input you need
    to configure is the connection, which must come directly from an ADP Auth component wired upstream
    — without a valid authenticated connection the tools cannot make any API calls, so ensure that link
    is in place before running the flow. Once connected, the output is a set of callable tools you pass
    to your agent or tool-executor component; you do not configure the individual tool calls here, as
    those are driven at runtime by the agent based on the worker identifiers and date ranges it receives.
    Keep in mind that both tools are strictly read-only and scoped to the `payroll/pay-statements v1`
    endpoint, so any write or update operations are outside what this component can do. If the image retrieval
    tool returns base64 content, your downstream logic will need to decode it before rendering or storing
    the file.'
- type: ADPTalentToolsComponent
  guide: 'You help the user configure a pair of ADP Workforce Now tools that let an AI agent read and
    write talent profile data across seven associate KSAOC tile types: certifications, competencies, educational
    degrees, languages, licenses, memberships, and recognitions. The component exposes these capabilities
    as two tools — one for reading entries (kind-aware, meaning the agent specifies which tile type it
    is querying) and one for writing them (action-aware, meaning the agent specifies the operation it
    wants to perform).


    The `connection` input is required and must come from an upstream ADP Auth component; without it,
    neither tool will function. The `enable_mutations` toggle is the most consequential setting here —
    it is off by default, and leaving it off means the agent can only read associate KSAOC records, never
    modify them. You should advise the user to turn this on only when the agent genuinely needs to create,
    update, or delete talent entries, since these writes directly alter associate records in ADP WFN and
    cannot be undone through this component. If the use case is reporting or auditing, keep mutations
    disabled. If the agent must manage talent data end-to-end, enable the toggle and ensure the connected
    ADP credentials carry sufficient permissions for write operations.'
- type: ADPTeamTimeCardsToolsComponent
  guide: 'This component exposes a read tool (`get_team_time_cards`) that retrieves time card records
    for a supervisor''s team from ADP Workforce Now, covering direct reports and optionally indirect reports,
    via the `time/team-time-cards v2` API endpoint.


    The only input you need to configure is `connection`, which must come from an ADP Auth component earlier
    in your flow — without a valid connection object the tool cannot authenticate against ADP WFN and
    will fail. Once wired up, the tool itself supports OData query parameters (filter, skip, top, select,
    and expand) that users can pass at invocation time to narrow results, page through large teams, or
    include additional related data; you do not configure those parameters here on the component, so guide
    users to pass them when calling the tool downstream. Keep in mind this is strictly a read tool — it
    cannot create, update, or delete time card entries. If the authenticated user is not a supervisor
    or lacks the appropriate ADP security profile to view team time cards, calls will likely return empty
    results or an authorization error rather than a configuration problem with this component.'
- type: ADPTimeCardsToolsComponent
  guide: 'This component exposes a single tool — `submit_time_entries` — that lets an AI agent write time-card
    data back to ADP Workforce Now via the `time/time-cards v2` API, targeting a specific worker by their
    OID and work-assignment ID with a batch of structured entries (either hour-based or time-pair format).


    You help the user configure two inputs. The `connection` input must be wired from an ADP Auth component;
    without a valid connection the component cannot reach the ADP API at all. The `enable_mutations` toggle
    is the more consequential setting: it is off by default, and you should make sure the user understands
    why — enabling it allows the agent to actually submit time entries, which flow downstream into payroll
    processing and can have real financial consequences if incorrect data is written. Only prompt the
    user to turn this on when they have confirmed their agent is tested, the target environment is appropriate
    (not production unless intentional), and they accept responsibility for the downstream payroll impact.
    There is no undo described in the metadata, so treat this flag as a deliberate, high-stakes decision
    rather than a routine toggle.'
- type: ADPTimeOffToolsComponent
  guide: 'This component produces a set of ADP time-off tools that an agent can call to read balance and
    configuration data, retrieve request summaries for the current user and their team, and optionally
    modify time-off balances.


    You help the user configure two inputs. The `connection` input must be wired from an ADP Auth component
    — without a valid connection, none of the tools will be able to authenticate against the ADP APIs,
    so make sure that upstream component is properly configured first. The `enable_mutations` toggle controls
    whether the balance-modification tool is exposed to the agent; it is off by default and should only
    be enabled when the workflow genuinely needs to write balance changes, since granting write access
    increases risk if the agent misuses the tool. The read-only tools — covering balances, configurations,
    request summaries for self, and team-level summaries — are always available regardless of that toggle.
    Remind the user that the modify tool is described as "gated," which may mean additional ADP permissions
    or role assignments are required on the ADP side before it will succeed even after being enabled here.'
- type: ADPTriggerComponent
  guide: You help the user configure a trigger component that listens for incoming ADP event payloads
    delivered via HTTP POST and passes matching events downstream in the flow. The most important input
    to configure is `event_types` — use it to specify which ADP event categories this trigger should react
    to; any incoming event whose type does not match your selection will be silently ignored, so make
    sure you include every type you want the flow to process. The `endpoint` input defines where ADP should
    send its POST requests, and the `api_key` is auto-generated — you must copy this value and provide
    it as the `x-api-key` header when configuring the webhook on the ADP side, otherwise incoming requests
    will be rejected. The `data` input receives the raw event payload and does not require manual configuration;
    it is populated automatically when ADP posts to the endpoint. Remind the user that if events appear
    to go unprocessed, the first things to check are whether the correct event types are selected and
    whether the API key in the ADP webhook settings exactly matches the generated value shown here.
- type: ADPUSTaxProfilesToolsComponent
  guide: 'This component exposes tools for reading and writing US tax profile data in ADP Workforce Now,
    covering both v1 and v2 of the us-tax-profiles API. You help the user connect it to their flow by
    ensuring the `connection` input is wired from an ADP Auth component — without a valid connection,
    none of the tools will function. The read tool, `get_worker_us_tax_profile`, can return summary, state,
    or local views of a worker''s tax profile, while the write tool, `manage_worker_us_tax_instruction`,
    allows adding, changing, or removing federal, state, or local tax instructions by specifying a `jurisdiction`
    and an `action` literal.


    Because mutations are disabled by default, the user must explicitly toggle `enable_mutations` to true
    if they need the manage tool to appear and be callable. Encourage them to leave this off in read-only
    or auditing flows to reduce the risk of unintended changes to live tax records. There is no partial
    exposure — flipping `enable_mutations` either makes the manage tool available or hides it entirely,
    so the user should make this decision deliberately based on whether their flow is intended to modify
    tax instructions or only retrieve them.'
- type: ADPWorkSchedulesToolsComponent
  guide: 'You help the user configure a component that provides AI tools for reading and modifying ADP
    Workforce Now work schedules. The `connection` input must be wired from an upstream ADP Auth component
    — without a valid connection, neither tool will function, so ensure that link is in place first. By
    default, only the read tool (`get_worker_work_schedules`) is exposed, which retrieves a worker''s
    existing schedules safely without risk of side effects. If the user also needs to create, update,
    or delete schedule data, they must explicitly enable the `enable_mutations` toggle, which unlocks
    the `manage_work_schedule` tool; this single tool covers nine distinct POST endpoints by accepting
    `scope` and `action` literal arguments at runtime, so the AI decides which endpoint to target based
    on context.


    Keep in mind that mutations are off by default as a deliberate safety guard — only enable them when
    the downstream assistant or flow is trusted to issue write operations against ADP. There is no partial
    exposure of individual mutation endpoints; it is all-or-nothing via the toggle. The component produces
    a `tools` output that should be connected to a language model or agent component that knows how to
    invoke them.'
- type: ADPWorkerAssignmentToolsComponent
  guide: 'This component exposes a set of ADP Workforce Now work-assignment mutation tools — changing
    a worker''s manager, updating organizational units, performing a generic work-assignment modification,
    and terminating a work assignment — for use by a Langflow Agent.


    You help the user wire in two inputs. The `connection` input must receive the output of an ADP Auth
    component; without a valid authenticated connection the tools cannot reach the ADP WFN API. The `enable_mutations`
    toggle is the critical safety gate: it defaults to off, meaning no mutation tools are exposed to the
    agent until you explicitly enable it. Only turn this on when the agent is intended to perform write
    operations against real worker records, since these actions — especially work-assignment termination
    — are irreversible or difficult to undo. There is no separate read-only mode within this component;
    enabling the flag exposes all four mutation tools at once, so make sure the agent''s broader configuration
    and any prompt guardrails are appropriate before activating it in a production environment. The component''s
    single output is the assembled tools list, which should connect to an Agent''s tools input.'
- type: ADPWorkerAssignmentV3ToolsComponent
  guide: 'This component exposes an ADP Workforce Now work-assignment creation tool to a Langflow Agent,
    calling the `hr-work-assignment-management` v3 REST API via a direct POST request. You help the user
    wire it up correctly and understand its two inputs before the resulting tools output reaches an Agent
    component.


    The `connection` input must receive the authenticated session object produced by a paired ADP Auth
    component — without it the tool has no credentials to make API calls. The `enable_mutations` toggle
    is the more important thing to draw attention to: it defaults to off, meaning no tools are exposed
    at all until the user deliberately enables it. This is a safety gate, so you should prompt the user
    to confirm they actually intend to write data to ADP before turning it on. Once enabled, the add-work-assignment
    tool becomes available on the tools output. Keep in mind there is no built-in read or update operation
    here — only the single add action is gated behind that flag. If a user expects broader worker-management
    capabilities, this component alone will not cover them.'
- type: ADPWorkerBiologicalToolsComponent
  guide: 'This component exposes tools for reading and modifying worker biological data — such as birth
    dates and related biological attributes — through ADP Workforce Now''s workers-biological-data-management
    API (v2, covering 4 endpoints), and passes those tools downstream to whatever agent or executor node
    you connect.


    You must wire a valid ADP Auth connection into the `connection` input before any tools will function;
    without it the component has no way to authenticate against the ADP API. The `enable_mutations` toggle
    is the critical control here: it is off by default because the mutation endpoints touch personally
    identifiable information (PII), so you should only switch it on when your flow explicitly requires
    write or update operations on biological records and you have confirmed the appropriate data-handling
    controls are in place. Leaving it off means the component surfaces only read-oriented tools, reducing
    risk in flows that have no need to alter this data. Be aware that there are no additional scoping
    inputs — enabling mutations opens all mutation endpoints at once, so treat this toggle with the same
    care you would apply to any PII-adjacent access grant.'
- type: ADPWorkerBusinessCommunicationToolsComponent
  guide: 'This component exposes a single agent tool that can add, change, or remove business communication
    contact records for ADP Workforce Now workers across five channels (such as email, phone, and similar
    contact types), routing each operation through the appropriate endpoint in the `workers-business-communication-management
    v2` tile.


    You need to wire in a valid connection from an ADP Auth component — without it the tool cannot authenticate
    against the ADP API. The more important input to think carefully about is `enable_mutations`: it is
    off by default and must be explicitly turned on before the tool becomes available to the agent at
    all. Leave it off in any flow where you want to read or inspect worker data without risking writes,
    and only enable it when your flow is intentionally managing contact records. Because a single tool
    covers all fifteen endpoints through `channel` and `action` parameters, enabling this switch grants
    the agent the ability to add, modify, and delete contact information in ADP — so treat it as a deliberate,
    audited decision rather than a routine toggle.'
- type: ADPWorkerCompensationToolsComponent
  guide: 'This component provides a set of ADP Workforce Now compensation-management tools — covering
    base-pay changes and additional-remuneration operations (add, change, or remove bonuses, allowances,
    and commissions) — that a Langflow Agent can call at runtime. You help the user wire it up and decide
    which capabilities to expose.


    The `connection` input must receive the token or session object produced by an upstream ADP Auth component;
    nothing will work without it. The critical decision point is `enable_mutations`, which is off by default.
    Leave it off if the agent only needs to read or reason about compensation data in other parts of the
    flow — enabling it unlocks tools that write directly to employee pay records, which are difficult
    to reverse and affect real payroll. Turn it on only when the flow is explicitly intended to make compensation
    changes, and make sure appropriate human-review steps or guardrails exist upstream before the agent
    can invoke those tools. There are no other inputs to configure; the full set of exposed tools appears
    as a single `tools` output that connects to your agent''s tools port.'
- type: ADPWorkerDemographicToolsComponent
  guide: 'This component exposes name and demographic-status mutation tools for use by Langflow Agents,
    wrapping ADP Workforce Now''s demographic data management API across six underlying endpoints consolidated
    into two tools. You help the user connect it correctly and decide whether to activate its write capabilities.


    The `connection` input must receive the output of an ADP Auth component — without a valid authenticated
    connection, no tools will be produced. The `enable_mutations` toggle is the critical safety gate:
    it defaults to off, meaning the component produces no active mutation tools until you explicitly enable
    it. You should only turn this on when the agent genuinely needs to write demographic changes back
    to ADP, such as updating worker names or demographic statuses. Keep it off in read-only or exploratory
    flows to avoid unintended data changes. There are no other configurable inputs, so if the user needs
    to control scope, filtering, or target workers, that logic must live elsewhere in the flow — this
    component solely governs authentication and whether the mutation tools are surfaced to the agent at
    all.'
- type: ADPWorkerDeploymentToolsComponent
  guide: 'This component exposes work-deployment mutation tools to a Langflow Agent, specifically the
    ability to change a worker''s standard hours and worker type against the ADP Workforce Now API (workers-work-deployment-management
    v2). You help the user connect it correctly and decide when mutations should be active.


    The `connection` input must be wired from an ADP Auth component — without a valid authenticated connection
    the tools cannot communicate with ADP. The `enable_mutations` toggle is the critical safety gate:
    it defaults to off, meaning the agent will not have access to any mutation tools until you explicitly
    enable it. Only turn this on when the agent is operating in a context where real changes to worker
    records are intended and appropriate, such as a tested production flow or an explicitly sanctioned
    automation. Because these tools write data to ADP — modifying standard hours or worker type — accidentally
    leaving mutations enabled in a development or exploratory flow could result in unintended changes
    to live worker records. There are no read-only fallback tools described in this component, so if `enable_mutations`
    remains off, the component produces no usable tools for the agent.'
- type: ADPWorkerHrProfilesToolsComponent
  guide: This component exposes a set of ADP Workforce Now HR worker-profile tools that a Langflow Agent
    can call to read and modify employee profile data, specifically covering additional remunerations,
    reportable benefits, corporate group creation, and primary work assignment management. You must always
    provide a valid `connection` from an upstream ADP Auth component — without it, none of the tools will
    function. By default, only the two read operations (listing additional remunerations and reportable
    benefits) are available to the agent. If your workflow needs to write data — creating a corporate
    group, setting a primary work assignment, or creating and updating reportable benefits — you must
    explicitly toggle `enable_mutations` on, which unlocks those four tools. Keep mutations off in read-only
    or exploratory flows to reduce the risk of unintended changes to employee records. Note that compensation-event
    endpoints are intentionally excluded here and belong in a separate compensation tile, so do not expect
    this component to handle those; route compensation event operations elsewhere in your flow to avoid
    gaps in coverage.
- type: ADPWorkerIdentificationToolsComponent
  guide: 'This component exposes government-ID mutation tools — specifically adding or updating SSNs,
    SINs, NIDs, and similar national identifiers against ADP Workforce Now''s workers-identification-management
    API — so that a Langflow Agent can act on worker identification records. You help the user connect
    the two inputs correctly: `connection` must receive the authenticated session object produced by an
    upstream ADP Auth component, so make sure that link is in place before anything else. The `enable_mutations`
    toggle is the critical gate here — it defaults to off deliberately, because the operations it unlocks
    write sensitive PII to ADP. Only switch it on when the flow is explicitly designed and authorized
    to create or modify government ID records; leaving it off means the agent will not see these tools
    at all, even if the connection is valid. Warn the user that enabling mutations in a general-purpose
    or exploratory flow is a significant data-governance risk, and that they should confirm downstream
    agent instructions are tightly scoped before turning this on.'
- type: ADPWorkerLeavesToolsComponent
  guide: 'This component exposes a set of ADP Workforce Now leave-management tools that an agent can call
    to read and act on employee leave records. You must wire a valid ADP Auth connection into the `connection`
    input — without it the component cannot authenticate against the WFN API. By default the component
    only surfaces read-only tools: listing an employee''s existing leaves and fetching leave-event metadata
    schemas. These are safe for any agent to use freely.


    The `enable_mutations` toggle is the critical decision point. When you switch it on, the agent gains
    four additional tools — requesting an absence, modifying a leave, cancelling a leave, and recording
    a return from leave. Leave these off unless the agent genuinely needs to write data, because leave
    events directly affect payroll calculations and benefits eligibility; an unintended mutation can have
    downstream consequences that are difficult to reverse. Only enable mutations in flows where the agent''s
    actions are reviewed or constrained, and ensure the connected ADP credential carries the appropriate
    WFN permissions for those write operations.'
- type: ADPWorkerLifecycleToolsComponent
  guide: 'This component provides mutation tools for managing ADP Workforce Now worker lifecycle events,
    currently exposing a rehire operation that the downstream agent can invoke against your ADP tenant.
    You must connect the output of an ADP Auth component to the `connection` input — without a valid connection
    the component cannot authenticate or execute any operations. The `enable_mutations` toggle is the
    critical gate here: it defaults to off, and you should only enable it when you are deliberately ready
    to allow the agent to perform real rehire transactions, since mistakes are difficult to reverse and
    affect live worker records. Leave it disabled in development, testing, or any flow where mutation
    capability is not explicitly intended. Be aware that hire and terminate operations are not yet available
    in this component even if you anticipate needing them; only rehire is currently exposed. The component''s
    single output is a tools bundle you wire into an agent or tool-executor component, and no rehire functionality
    will be accessible to that agent unless `enable_mutations` is actively turned on.'
- type: ADPWorkerPayrollInstructionsToolsComponent
  guide: 'This component produces a set of tools that let an agent read and manage payroll instructions
    for ADP Workforce Now workers. You must always supply a valid connection from an ADP Auth component
    — without it, none of the tools will function. The `enable_mutations` toggle is the key decision point:
    leave it off (the default) when your flow only needs to retrieve or inspect a worker''s payroll instructions
    via `get_worker_payroll_instructions`. Turn it on only when the flow is explicitly designed to create,
    modify, or stop general deductions using `manage_worker_general_deduction`, since deduction changes
    affect live payroll data and can have broad consequences if triggered incorrectly. Because mutation
    capability is consolidated into a single tool gated behind this flag, enabling it exposes the full
    start/change/stop surface to the agent at once — there is no finer-grained control per operation.
    Make sure downstream logic or agent instructions are scoped carefully before activating mutations,
    and confirm the authenticated ADP connection carries the permissions required for whichever operations
    the agent will perform.'
- type: ADPWorkerPersonalCommunicationToolsComponent
  guide: 'This component exposes mutation tools that let a Langflow Agent add, change, or remove personal
    contact details — addresses, phone numbers, and email addresses — for workers in ADP Workforce Now,
    backed by the ADP personal-communication-management v2 API. You help the user connect it correctly
    and decide when it is safe to activate.


    The `connection` input must receive the output of an ADP Auth component; without a valid authenticated
    connection the tools cannot reach the ADP API at all. The `enable_mutations` toggle is the critical
    gate: it defaults to off because modifying an employee''s contact information is considered high-blast-radius
    — a mistake can affect payroll delivery, tax documents, and system notifications. Only turn it on
    when the enclosing flow is explicitly designed to manage personal contact data, and ensure appropriate
    human-in-the-loop review or scoping is in place before doing so. Each tool exposed downstream accepts
    an `operation` value of add, change, or remove alongside the relevant channel-specific fields; the
    agent selects and calls these tools at runtime, so the tools output feeds directly into an agent component.'
- type: ADPWorkerToolsComponent
  guide: 'This component gives a Langflow Agent a set of narrowly scoped tools for retrieving employee
    data from ADP, covering areas like name, address, contact details, job information, and compensation
    — each tool fetches only the fields relevant to its purpose from the ADP /hr/v2/workers API.


    The only input you need to configure is the connection, which must come from an ADP Auth component
    wired earlier in your flow; without a valid authenticated connection, none of the tools will be able
    to reach the ADP API. Make sure the upstream ADP Auth component is fully configured and its output
    is connected here before your agent attempts to call any of these tools. Because each tool targets
    a specific slice of worker data rather than returning a full employee record, your agent will need
    to call multiple tools if it requires information spanning more than one category — do not expect
    a single tool invocation to return a comprehensive employee profile. The tools are passed as outputs
    to whichever Agent component you connect downstream.'
