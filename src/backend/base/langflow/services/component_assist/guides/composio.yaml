- type: ComposioAPIComponent
  guide: 'This component connects your agent to Composio''s toolset, allowing it to execute actions through
    external integrations by exposing a set of callable tools as output.


    You should always provide your Composio API key — refer to https://docs.composio.dev/faq/api_key/api_key
    if you need help locating it. The `tool_name` field identifies which specific Composio tool or integration
    you want to work with, while `actions` lets you scope down exactly which operations within that tool
    the agent is permitted to run; leaving actions too broad may expose unintended capabilities, so be
    intentional about what you include. The `entity_id` field represents the user or entity context under
    which the tool executes — this is important when your Composio setup manages multiple connected accounts
    or users, as it determines whose credentials and permissions are applied during execution. If you
    are working with a single account setup you may be able to leave this as the default, but confirm
    this against your Composio configuration. Because the component''s single output is a `tools` object
    consumed downstream by an agent node, ensure the receiving component expects a tool-compatible input
    format.'
- type: ComposioAgentQLAPIComponent
  guide: 'This component connects to the AgentQL API through Composio, enabling you to authenticate and
    execute AgentQL actions whose results are returned as a DataFrame for downstream processing. The `entity_id`
    identifies which Composio entity is making the request, and `auth_mode` controls which set of credentials
    you need to fill in — for example, OAuth2 flows require `client_id`, `client_secret`, `authorization_url`,
    `token_url`, and often a `redirect_uri` or `authorization_code`, while simpler setups may only need
    `generic_api_key` or `bearer_token`. The `auth_link` field is typically populated automatically when
    you initiate an OAuth handshake through Composio rather than entered manually.


    Be careful not to confuse the several key-like fields: `api_key` and `generic_api_key` serve different
    purposes depending on how Composio routes authentication, and `token`, `access_token`, and `bearer_token`
    are similarly distinct slots tied to specific auth modes. Fields like `subdomain`, `domain`, `base_url`,
    `instance_url`, and `tenant_id` are only relevant when the AgentQL integration targets a specific
    hosted environment. Leave fields blank that do not apply to your chosen auth mode — populating unrelated
    fields will not cause errors but may create confusion. Once credentials are configured, trigger execution
    using the `action_button`. Consult https://docs.composio.dev for the exact auth mode your AgentQL
    connection requires.'
- type: ComposioAgiledAPIComponent
  guide: 'This component connects to the Agiled project management platform via Composio, authenticates
    using your chosen method, and executes an action that returns results as a DataFrame. The most important
    starting point is selecting the right authentication mode using the `auth_mode` input, since everything
    else flows from that choice. For API key authentication, fill in `generic_api_key` (entering it on
    the Composio page as prompted) and optionally `api_key_field`. For OAuth2 flows, you will need `client_id`,
    `client_secret`, `redirect_uri`, `authorization_url`, `token_url`, and potentially `authorization_code`,
    `access_token`, or `refresh_token`. If your Agiled account is hosted on a custom domain or subdomain,
    set `domain`, `subdomain`, or `instance_url` accordingly. The `entity_id` ties the connection to a
    specific Composio entity, and `tenant_id` is relevant if you work in a multi-tenant environment. Once
    authentication inputs are correctly filled, trigger execution with `action_button`. A key gotcha:
    because none of the inputs carry inline descriptions, refer to the Composio documentation at https://docs.composio.dev
    to confirm which fields your specific auth mode actually requires — supplying unnecessary credentials
    for the wrong mode can cause silent failures or conflicts.'
- type: ComposioAirtableAPIComponent
  guide: 'This component connects to Airtable through the Composio integration layer, executing actions
    against your Airtable account and returning results as a structured data frame. The most important
    starting point is authentication: use `generic_api_key` to provide your API key directly on the Composio
    page, which is the recommended path for most users. If your setup requires OAuth, you will need to
    supply `client_id`, `client_secret`, `redirect_uri`, `authorization_url`, `token_url`, and ultimately
    an `authorization_code` or `access_token`/`refresh_token` pair. The `auth_mode` field governs which
    of these credential sets is actually used, so make sure it matches the fields you have populated.
    The `entity_id` ties the connection to a specific Composio entity, and leaving it blank will typically
    fall back to a default.


    Be aware that many of the 26 inputs correspond to different authentication schemes — OAuth2, bearer
    tokens, basic username/password, API key headers — and you only need the subset relevant to your chosen
    `auth_mode`; leaving the others empty is expected and harmless. Fields like `subdomain`, `domain`,
    `instance_url`, and `base_url` are only relevant if your Composio setup or Airtable workspace requires
    a non-standard endpoint. Once authentication is established, trigger execution with `action_button`
    and the component will output its results as a data frame for downstream processing.'
- type: ComposioApolloAPIComponent
  guide: 'You help the user configure a connection to the Apollo sales intelligence API via Composio,
    which proxies authenticated requests to Apollo and returns results as a dataFrame for downstream processing.
    The most important input to set first is the authentication approach: `auth_mode` determines which
    credential fields are actually required, so fill only the fields relevant to your chosen method. For
    a straightforward API key setup, enter your key in `generic_api_key` (which Composio uses on its own
    configuration page) or in `api_key` directly. If you are using OAuth2, you will need `client_id`,
    `client_secret`, `authorization_url`, `token_url`, and likely `redirect_uri` and `scopes`; once the
    OAuth flow completes, `access_token` and optionally `refresh_token` will hold the session credentials.
    Fields like `subdomain`, `domain`, `instance_url`, `base_url`, and `tenant_id` are only relevant if
    your Apollo setup or Composio integration targets a non-default endpoint. The `entity_id` ties this
    connection to a specific Composio entity, so set it if you are managing multiple users or accounts.
    Once credentials are in place, trigger execution with `action_button`. Avoid filling unrelated auth
    fields simultaneously, as conflicting values may cause authentication failures.'
- type: ComposioAsanaAPIComponent
  guide: 'This component connects to the Asana API via Composio, allowing you to trigger Asana actions
    and retrieve results as a structured data frame you can pass downstream in your flow.


    The inputs you need depend entirely on the authentication method you choose via `auth_mode`. For most
    setups, start by entering your `entity_id` to identify the Composio entity and selecting the appropriate
    auth mode. If you are using a simple API key, fill in `generic_api_key` (you will be directed to enter
    this on the Composio page) or `api_key` directly. For OAuth2 flows, you will need `client_id`, `client_secret`,
    `authorization_url`, `token_url`, `redirect_uri`, and potentially `scopes`; once the user authorizes,
    supply the `authorization_code` or resulting `access_token` and `refresh_token`. Bearer token auth
    requires only `bearer_token`, while basic auth needs `username` and `password`. Fields like `subdomain`,
    `domain`, `base_url`, `instance_url`, and `tenant_id` are situational — fill them only if your Asana
    setup or Composio configuration requires a non-default endpoint. Leave any inputs unrelated to your
    chosen auth strategy blank. Once credentials are configured, trigger execution with `action_button`.
    Note that all result data comes back as a single data frame, so downstream components should expect
    tabular output.'
- type: ComposioAttioAPIComponent
  guide: 'This component connects to the Attio CRM API through Composio, allowing you to trigger actions
    against your Attio workspace and receive the results as a structured data frame. You help the user
    supply the correct authentication details and then execute the desired action via the action button.


    The most important field to configure first is the auth mode, which determines which other credentials
    are required. If using a simple API key approach, focus on the generic API key field (entered through
    the Composio page) or the api_key and api_key_field inputs. For OAuth2 flows, you will need combinations
    of client_id, client_secret, redirect_uri, authorization_url, token_url, and potentially authorization_code,
    access_token, or refresh_token. Bearer token authentication requires only the bearer_token field.
    Fields like domain, subdomain, base_url, instance_url, and tenant_id are relevant only when your Attio
    setup uses a custom or non-standard endpoint — most users can leave these blank. The entity_id and
    auth_link fields tie the connection to a specific Composio-managed entity. Once credentials are in
    place, trigger execution using the action button, which produces the output data frame. Avoid populating
    credential fields that do not match your chosen auth mode, as supplying conflicting values may cause
    unexpected behavior.'
- type: ComposioBitbucketAPIComponent
  guide: 'This component connects to the Bitbucket API via Composio, executes an action against Bitbucket''s
    platform, and returns the result as a DataFrame. The inputs you need to fill depend entirely on which
    authentication mode you choose: for basic authentication, provide `username` and `password`; for API
    key authentication, use `generic_api_key` (entered through the Composio page) along with `api_key_field`
    to specify where the key is sent; for OAuth 2.0 flows, you''ll need `client_id`, `client_secret`,
    `authorization_url`, `token_url`, and potentially `redirect_uri`, `authorization_code`, `access_token`,
    and `refresh_token`. The `entity_id` ties the connection to a specific user or account within Composio,
    and `auth_mode` determines which credential fields are active. Fields like `bearer_token`, `token`,
    `domain`, `base_url`, `subdomain`, `instance_url`, and `tenant_id` apply only to specific auth modes
    or deployment configurations, so leave unused fields blank. Once credentials are configured, trigger
    the desired Bitbucket operation using `action_button`. Be aware that credential fields are sensitive
    — avoid hardcoding secrets directly if your flow is shared. Refer to Composio''s documentation at
    docs.composio.dev for supported actions and the exact auth mode your Bitbucket setup requires.'
- type: ComposioBolnaAPIComponent
  guide: 'This component connects to the Bolna service via Composio, authenticating your account and exposing
    Bolna actions as structured data you can pass downstream in your flow. The output is a dataFrame containing
    the results of whichever action you trigger.


    Because Bolna supports multiple authentication strategies, you only need to fill in the fields relevant
    to your chosen method — ignore the rest. If you are using a simple API key, enter it in the `generic_api_key`
    field on the Composio page and leave OAuth fields (such as `client_id`, `client_secret`, `authorization_url`,
    `token_url`, `authorization_code`, `access_token`, and `refresh_token`) blank. For OAuth 2.0 flows,
    populate those OAuth fields along with `redirect_uri` and `scopes` as required by your Bolna app registration.
    Fields like `subdomain`, `domain`, `base_url`, `instance_url`, and `tenant_id` are only relevant if
    your Bolna setup targets a specific hosted environment. The `entity_id` ties the connection to a particular
    Composio entity, so make sure it matches the entity you configured in Composio. Once credentials are
    in place, use the `action_button` to trigger the configured action. Avoid filling in conflicting credential
    sets simultaneously, as mixing auth fields from different schemes may cause authentication failures.'
- type: ComposioBrightdataAPIComponent
  guide: 'This component connects to the Brightdata service via the Composio integration layer and executes
    an action, returning results as a DataFrame. You help the user supply the right authentication credentials
    and trigger the action correctly.


    The inputs you''ll need depend entirely on which authentication mode Brightdata requires. For simple
    API key auth, focus on `generic_api_key` — this is the credential entered through the Composio authentication
    page. If OAuth2 is involved, the relevant fields are `client_id`, `client_secret`, `authorization_url`,
    `token_url`, `redirect_uri`, `authorization_code`, and potentially `scopes`. Token-based flows use
    `token`, `access_token`, `bearer_token`, or `refresh_token`. Credential-based auth uses `username`
    and `password`. Fields like `domain`, `subdomain`, `base_url`, `instance_url`, and `tenant_id` may
    be required depending on how Brightdata routes requests. The `entity_id` identifies which Composio
    entity is acting, and `auth_mode` controls which credential set is active. Once credentials are in
    place, the user clicks `action_button` to execute. A key gotcha: only fill fields relevant to your
    chosen auth mode — leaving unneeded credential fields blank avoids conflicts. Consult https://docs.composio.dev
    for Brightdata-specific auth requirements.'
- type: ComposioCalendlyAPIComponent
  guide: 'This component connects to the Calendly API via Composio, allowing you to trigger Calendly actions
    from within your flow and receive the results as a structured dataframe. To get started, you must
    supply authentication credentials — the most straightforward path is entering your API key through
    the Composio page using the `generic_api_key` field. Depending on which authentication mode you select
    via `auth_mode`, different credential fields become relevant: OAuth2 flows will require `client_id`,
    `client_secret`, `redirect_uri`, `authorization_url`, `token_url`, and potentially `authorization_code`
    or `refresh_token`; bearer-based auth uses `bearer_token`; basic auth relies on `username` and `password`.
    The `entity_id` field scopes the request to a specific Composio entity, while `auth_link` can be used
    if you are directing a user through an external authorization step.


    Be aware that only the credentials appropriate for your chosen `auth_mode` need to be filled — supplying
    mismatched fields will not cause errors but will have no effect. The `action_button` triggers the
    actual API call, so ensure all required credentials are configured before activating it. Fields like
    `subdomain`, `domain`, `instance_url`, `base_url`, and `tenant_id` are unlikely to be needed for standard
    Calendly usage but are available if your Composio setup routes through a custom endpoint. Output is
    always returned as a dataframe, so downstream components should expect tabular data.'
- type: ComposioCanvaAPIComponent
  guide: 'This component connects to the Canva API through Composio, allowing you to trigger Canva-related
    actions from within your flow and receive the results as a DataFrame. To get started, the most important
    field is `generic_api_key`, where you enter the API key from your Composio account page — this is
    the primary credential that authenticates the integration. The `entity_id` identifies which user or
    entity the action runs on behalf of, and `auth_mode` determines which authentication strategy is used;
    depending on that choice, you may need to fill in fields like `client_id` and `client_secret` for
    OAuth flows, `bearer_token` or `access_token` for token-based auth, or `username` and `password` for
    basic auth — only populate the fields relevant to your chosen mode.


    Be aware that most credential fields (such as `refresh_token`, `authorization_code`, `redirect_uri`,
    and `scopes`) are only meaningful in specific OAuth configurations, so leave unused fields blank to
    avoid conflicts. The `action_button` triggers execution once everything is configured. All results
    are returned as a single DataFrame output, so downstream components should expect tabular data. If
    you encounter authentication issues, consult the Composio documentation at docs.composio.dev to confirm
    which auth fields your specific Canva integration requires.'
- type: ComposioCanvasAPIComponent
  guide: 'This component connects to the Canvas API via Composio, authenticates using your chosen method,
    and returns results as a DataFrame. The `entity_id` identifies which Composio entity is making the
    request, and `api_key` is your Composio platform key — distinct from the `generic_api_key`, which
    is the actual Canvas API credential you enter on the Composio authorization page. The `auth_mode`
    field drives which other credential inputs are relevant: OAuth2 flows require `client_id`, `client_secret`,
    `redirect_uri`, `authorization_url`, `token_url`, and potentially `scopes` or `authorization_code`,
    while token-based modes use `token`, `access_token`, `bearer_token`, or `refresh_token`. Basic auth
    relies on `username` and `password`. Fields like `subdomain`, `domain`, `instance_url`, `base_url`,
    and `tenant_id` let you point the component at the correct Canvas instance — fill in whichever your
    Canvas deployment requires.


    Be careful not to confuse Composio''s own `api_key` with the Canvas-specific `generic_api_key`; mixing
    these up is a common source of authentication failures. Only populate credential fields that match
    your selected `auth_mode`, as unused fields are typically ignored but can cause confusion. Once credentials
    are configured, trigger execution with the `action_button`. Refer to https://docs.composio.dev for
    supported auth modes and required field combinations specific to Canvas.'
- type: ComposioCodaAPIComponent
  guide: This component connects to the Coda API through Composio, allowing you to trigger actions against
    your Coda documents and tables and receive the results as a DataFrame. You help the user supply the
    right credentials for whichever authentication method their Coda connection requires. For most straightforward
    setups, the `generic_api_key` field is where the user enters their API key directly on the Composio
    page — this is the most common path. If the connection is configured for OAuth, the user will need
    to provide values such as `client_id`, `client_secret`, `authorization_url`, `token_url`, and potentially
    `redirect_uri`, `scopes`, and `authorization_code`; bearer or access token flows use `bearer_token`
    or `access_token` instead. Fields like `subdomain`, `domain`, `base_url`, and `instance_url` only
    apply if the integration requires a custom endpoint. The `entity_id` identifies which Composio-managed
    identity to act as, and `auth_mode` controls which credential set is active. Once credentials are
    in place, the user clicks `action_button` to execute the configured action. A key constraint is that
    only one authentication strategy should be populated at a time — mixing fields from different auth
    flows may cause unexpected behavior. Refer to the Composio documentation at https://docs.composio.dev
    for supported Coda actions and precise OAuth setup steps.
- type: ComposioContentfulAPIComponent
  guide: 'This component connects to the Contentful API via Composio, allowing you to trigger Contentful
    actions and retrieve results as a structured data frame within your flow. You help the user establish
    the correct authentication and then execute the desired action using the action button.


    The most important field to configure first is the authentication setup. The `generic_api_key` field
    (labeled "Enter API key on Composio page") is typically your entry point — use it to provide the Composio
    API key that links this component to your connected Contentful account. The `entity_id` identifies
    which Composio entity to act on behalf of, and `auth_mode` determines which credential fields are
    relevant: for API key auth you''ll use `api_key`, for OAuth2 flows you''ll need `client_id`, `client_secret`,
    `redirect_uri`, `authorization_url`, `token_url`, and possibly `authorization_code` or `refresh_token`,
    while bearer-token auth relies on `bearer_token` or `access_token`. Fields like `domain`, `base_url`,
    `subdomain`, `instance_url`, and `tenant_id` are only relevant if your Contentful setup uses a custom
    or organization-specific endpoint. Once credentials are in place, trigger the operation with the `action_button`.
    Note that only fields matching your chosen auth mode need to be filled — leaving irrelevant credential
    fields empty is expected and safe.'
- type: ComposioDigicertAPIComponent
  guide: 'This component connects to the DigiCert API through Composio, allowing you to authenticate and
    trigger DigiCert actions that return results as a dataFrame for downstream processing. The most important
    input to configure first is `generic_api_key`, where you enter your Composio API key on the Composio
    page — this is what authorizes the connection through Composio''s middleware layer. Beyond that, the
    authentication inputs you''ll actually need depend on DigiCert''s required auth method: use `api_key`
    or `bearer_token` for key-based flows, `username` and `password` for basic auth, or the OAuth-related
    fields (`client_id`, `client_secret`, `authorization_url`, `token_url`, `access_token`, `refresh_token`,
    `authorization_code`, `scopes`, and `redirect_uri`) for OAuth flows. Fields like `domain`, `subdomain`,
    `base_url`, `instance_url`, and `tenant_id` let you point the integration at a specific DigiCert environment
    or account scope when needed. Only fill in the fields relevant to your chosen `auth_mode` — leaving
    unneeded credential fields blank is expected. Once credentials are configured, use `action_button`
    to trigger the configured action, and the component will return results as a dataFrame. Refer to https://docs.composio.dev
    for supported actions and required scopes.'
- type: ComposioDiscordAPIComponent
  guide: 'This component connects to Discord via the Composio integration layer, allowing you to trigger
    Discord actions and receive results as a structured data frame. To get started, you must supply an
    authenticated identity: the `entity_id` identifies which Composio-managed user or account the action
    runs on behalf of, while `generic_api_key` is where you enter the API key from the Composio dashboard.
    Depending on which auth strategy Discord requires for your use case, you may also need to fill in
    fields like `auth_mode` alongside the corresponding credentials — for example, `client_id` and `client_secret`
    for OAuth2 flows, `bearer_token` or `access_token` for token-based auth, or `username` and `password`
    for basic auth. Supporting OAuth fields such as `redirect_uri`, `authorization_url`, `token_url`,
    `scopes`, and `authorization_code` are only relevant when orchestrating a full OAuth handshake. Fields
    like `subdomain`, `domain`, `base_url`, and `instance_url` let you override endpoint targeting if
    needed, but most users will leave these blank. Once authentication is configured, use `action_button`
    to execute the chosen Discord action. Be aware that providing conflicting or incomplete auth fields
    may silently fail; consult the Composio documentation at https://docs.composio.dev to confirm which
    fields your specific auth mode requires.'
- type: ComposioDropboxAPIComponent
  guide: This component connects to Dropbox via the Composio integration layer, allowing your flow to
    trigger Dropbox actions and receive the results as a DataFrame output. The most important field to
    configure first is `generic_api_key`, where you enter your Composio API key — this authenticates your
    connection to the Composio platform itself, not directly to Dropbox. Use `entity_id` to specify which
    Composio-managed user or account the action should run on behalf of. The `auth_mode` field controls
    how Dropbox authorization is handled; depending on the mode you choose, you may need to supply supporting
    fields such as `client_id` and `client_secret` for OAuth flows, `access_token` or `bearer_token` for
    token-based access, `username` and `password` for basic auth, or `api_key` for key-based access. Fields
    like `redirect_uri`, `authorization_url`, `token_url`, `authorization_code`, `refresh_token`, and
    `scopes` are relevant only when setting up an OAuth 2.0 flow. Once authentication is configured, use
    `action_button` to trigger the configured Dropbox action. Note that all credential fields are sensitive
    — avoid hardcoding secrets directly if your flow will be shared. Refer to the Composio documentation
    at docs.composio.dev for the full list of supported Dropbox actions and the specific auth modes available.
- type: ComposioElevenLabsAPIComponent
  guide: This component connects to the ElevenLabs API through Composio, allowing you to trigger ElevenLabs
    actions from within your flow and receive the results as a DataFrame. To get started, you must provide
    the `entity_id` to identify which Composio entity is making the request, and supply authentication
    credentials appropriate to the auth method you choose via `auth_mode`. The most straightforward path
    is entering your ElevenLabs API key directly in the Composio dashboard and referencing it through
    `generic_api_key`. If you are using OAuth2, you will need to populate relevant fields such as `client_id`,
    `client_secret`, `authorization_url`, `token_url`, `redirect_uri`, and potentially `scopes` and `authorization_code`.
    Token-based flows may require `access_token`, `refresh_token`, or `bearer_token` depending on the
    configuration. Fields like `subdomain`, `domain`, `base_url`, `instance_url`, and `tenant_id` are
    only relevant if your Composio setup or ElevenLabs account requires a non-default endpoint. Avoid
    filling in credential fields that do not match your chosen auth method, as supplying conflicting values
    may cause authentication to fail. Once credentials are configured, use the `action_button` to trigger
    the selected action and surface results downstream as a DataFrame.
- type: ComposioExaAPIComponent
  guide: 'This component connects to the Exa search API through Composio, authenticating your account
    and executing actions that return results as a dataFrame output. You help the user establish a working
    connection by filling in the appropriate credentials based on their chosen authentication method.


    The most common starting point is entering an API key via the `generic_api_key` field, which corresponds
    to the key generated on the Composio platform — not directly from Exa. The `entity_id` identifies
    which Composio entity the connection belongs to, and `auth_mode` determines which credential fields
    are relevant: OAuth flows will require fields like `client_id`, `client_secret`, `authorization_url`,
    `token_url`, `redirect_uri`, and potentially `scopes` or `authorization_code`, while simpler setups
    may only need a `token`, `bearer_token`, or `access_token`. Fields like `subdomain`, `tenant_id`,
    `instance_url`, `base_url`, and `domain` apply only when connecting to specific hosted environments.
    Avoid filling in unrelated credential fields for your chosen auth mode, as unnecessary values may
    cause conflicts. Once credentials are configured, use the `action_button` to trigger the connection
    or action. All results are returned as a dataFrame, so downstream components should expect tabular
    data.'
- type: ComposioFigmaAPIComponent
  guide: 'You help the user connect to the Figma API via Composio, enabling them to trigger Figma-related
    actions and retrieve results as a DataFrame within the flow. The core decision is which authentication
    method applies to their Composio setup: if they are using a simple API key, they should fill in `generic_api_key`
    (entering it on the Composio page as prompted) and set `auth_mode` accordingly. For OAuth2 flows,
    the relevant fields are `client_id`, `client_secret`, `redirect_uri`, `authorization_url`, `token_url`,
    `authorization_code`, `access_token`, and `refresh_token`. Bearer token auth uses the `bearer_token`
    field, while basic auth relies on `username` and `password`. The `entity_id` ties the connection to
    a specific Composio entity, so make sure it matches the entity configured in your Composio account.


    Be aware that many of these fields are mutually exclusive depending on the auth mode chosen — filling
    in fields that don''t match your selected `auth_mode` will likely cause errors or be ignored. Fields
    like `subdomain`, `domain`, `base_url`, `instance_url`, and `tenant_id` may only be relevant for specific
    Composio connection configurations, so leave them blank unless your setup requires them. Once authentication
    is configured correctly, use `action_button` to trigger the desired Figma action, and the component
    will return its results as a DataFrame. Refer to the Composio documentation at docs.composio.dev for
    details on supported actions.'
- type: ComposioFinageAPIComponent
  guide: This component connects to the Finage financial data API through Composio, allowing you to authenticate
    and retrieve data that flows out as a DataFrame for use in downstream components. Because Finage supports
    multiple authentication strategies, you only need to fill in the fields relevant to your chosen method
    — for most users, that means entering your Finage API key into the `generic_api_key` field (labeled
    "Enter API key on Composio page") and leaving OAuth-related fields like `client_id`, `client_secret`,
    `authorization_code`, `access_token`, and `refresh_token` blank. If your setup uses OAuth2, you will
    need to provide the appropriate `auth_link`, `redirect_uri`, `token_url`, and related token fields
    instead. The `entity_id` field lets you scope the connection to a specific Composio entity if you
    manage multiple users or accounts. Fields like `subdomain`, `instance_url`, `domain`, and `tenant_id`
    are only relevant if your Finage configuration targets a non-default endpoint. Once credentials are
    configured, trigger the `action_button` to initiate the connection. Be aware that only the credential
    fields matching your selected `auth_mode` are required — populating unrelated fields will not cause
    errors but adds unnecessary noise. Refer to https://docs.composio.dev for guidance on which auth mode
    Finage supports.
- type: ComposioFirecrawlAPIComponent
  guide: You help the user connect and authenticate a Firecrawl integration through the Composio platform,
    which orchestrates web-crawling actions and returns the results as a DataFrame. The most important
    starting point is `entity_id`, which identifies which Composio entity (user or account) this connection
    belongs to, and `generic_api_key`, where you enter the API key on the Composio page to authorize Firecrawl
    access. The `auth_mode` input determines which authentication fields are actually relevant — for example,
    OAuth2 flows require `client_id`, `client_secret`, `authorization_url`, `token_url`, and potentially
