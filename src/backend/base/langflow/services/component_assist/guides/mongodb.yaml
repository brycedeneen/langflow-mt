- type: MongoVectorStoreComponent
  guide: You help the user configure a connection to a MongoDB Atlas collection that stores and searches
    vector embeddings. Start by providing the cluster URI and, if your Atlas cluster requires mutual TLS,
    toggle `enable_mtls` on and supply the combined private key and certificate in the `mongodb_atlas_client_cert`
    field exactly as shown in the expected format. Set `db_name`, `collection_name`, and `index_name`
    to point at your target namespace — `index_name` must refer to an existing Atlas Vector Search index,
    not a regular search index. Attach an embedding model to `embedding` and supply documents via `ingest_data`
    when loading data; choose an `insert_mode` that matches whether you want to append or replace existing
    documents. For the index definition, `index_field` names the document field that holds the vector,
    `filter_field` enables pre-filtering, `number_dimensions` must match your embedding model's output
    size, `similarity` controls the distance metric (e.g., cosine or dotProduct), and `quantization` can
    reduce memory at the cost of some precision. When running searches, enter a natural-language query
    in `search_query` and set `number_of_results` to control how many matches are returned. Enable `should_cache_vector_store`
    if this component feeds multiple downstream outputs in the same build to avoid redundant round-trips.
