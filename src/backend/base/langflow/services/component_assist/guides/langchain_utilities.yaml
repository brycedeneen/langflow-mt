- type: CSVAgentComponent
  guide: 'You help the user configure an agent that reads a CSV file and answers questions about its contents
    using a language model. The two most essential inputs to set first are `path` (the CSV file or file
    path the agent will analyze) and `model` (the LLM provider or connected Language Model component,
    which requires a corresponding `api_key`). The `input_value` field carries the user''s question or
    instruction directed at the CSV data. If the agent struggles to complete its task, raise `max_iterations`
    to give it more attempts, or enable `handle_parsing_errors` to let it recover from malformed inputs
    gracefully. Use `pandas_kwargs` if you need to control how the CSV is loaded (e.g., specifying delimiters
    or encodings), and select `agent_type` to switch between different underlying agent strategies. The
    `agent_description` field only matters when the component is wired into Tool Mode and is flagged as
    deprecated, so avoid relying on it. Pay close attention to `allow_dangerous_code`: leaving it disabled
    is the safe default and still permits CSV analysis, but enabling it allows arbitrary Python execution
    on the server — only turn it on if you fully trust all input sources. The component exposes both a
    `response` output (the agent''s answer) and an `agent` output (the constructed agent object for chaining).'
- type: CharacterTextSplitterComponent
  guide: 'You help the user configure a component that breaks incoming text into smaller, fixed-size pieces
    based on character count. The primary input to connect is `data_input`, which receives the text or
    documents to be divided. Use `chunk_size` to set the maximum number of characters allowed in each
    resulting chunk — smaller values produce more granular pieces, while larger values keep more context
    together. `chunk_overlap` controls how many characters are shared between consecutive chunks, which
    helps preserve context across boundaries; setting it to zero means chunks are entirely distinct. The
    `separator` field defines the character sequence the splitter tries to split on before falling back
    to raw character counting — if you leave it empty, it defaults to `\n\n` (double newline), which naturally
    respects paragraph boundaries.


    One important constraint: `chunk_overlap` must be smaller than `chunk_size`, otherwise the splitter
    cannot make forward progress and will error. If your text lacks the specified separator, the splitter
    will still enforce the character limit by cutting at the exact character boundary, so choose a separator
    that actually appears in your data for cleaner splits.'
- type: ConversationChainComponent
  guide: 'You help the user configure a conversational chain that maintains context across multiple turns
    by loading and storing history through a connected memory component. The three inputs work together:
    `llm` should be connected to a language model component — this is the engine that generates responses,
    so choosing the right model and its settings (temperature, provider, etc.) happens upstream in that
    component, not here. The `memory` input should be wired to a memory component (such as a buffer or
    summary memory) that handles how past conversation turns are stored and retrieved; without this connection
    the chain loses context between interactions. The `input_value` is the current user message or query
    being passed into the chain for this turn.


    A key constraint to keep in mind is that the quality of conversational continuity depends entirely
    on what the connected memory component supports — if no memory is attached, the chain effectively
    behaves as a single-turn call. Make sure the memory and LLM components are both connected before running
    the chain, as leaving either disconnected will cause the component to fail. The output is a plain
    text response generated by the model given the current input and the retrieved conversation history.'
- type: FakeEmbeddingsComponent
  guide: 'This component produces randomly generated embedding vectors, giving you a lightweight stand-in
    for a real embeddings model so you can wire up and test downstream components without needing API
    keys or incurring costs.


    The only input you need to configure is `dimensions`, which controls how many numerical values make
    up each embedding vector. Set this to match whatever dimensionality your downstream component expects
    — for example, if a vector store or similarity search node assumes 1536-dimensional embeddings, enter
    1536 here. There are no authentication requirements or model-specific constraints to worry about.
    Keep in mind that because the vectors are randomly generated rather than semantically meaningful,
    any similarity or retrieval results produced downstream will be nonsensical; this component is strictly
    for validating that your flow connects and runs correctly, not for producing usable outputs. Once
    your pipeline is working end-to-end, swap this component out for a real embeddings model.'
- type: HtmlLinkExtractorComponent
  guide: You help the user configure a component that parses HTML content and pulls out all hyperlinks
    found within it. The most important input to set up first is `data_input`, which accepts the HTML
    texts you want to scan — make sure the upstream component is passing actual HTML content here, not
    plain text or pre-processed strings, or link extraction will likely yield nothing useful. The `kind`
    input controls how extracted links are typed or categorized internally (for example, distinguishing
    hyperlinks from other link varieties when used in a graph vector store context), so adjust it if your
    downstream pipeline expects a specific link kind label. The `drop_fragments` flag determines whether
    URL fragments — the `#section` portion of a URL — are stripped before links are returned; enable this
    when fragment variations of the same URL would otherwise create duplicate or noisy entries. Keep in
    mind that all three inputs lack detailed descriptions in the metadata, so if behavior seems unexpected,
    consult the LangChain community documentation linked to this component. The output is the enriched
    data with extracted links attached, ready to feed into graph vector store or retrieval workflows.
- type: JsonAgentComponent
  guide: 'This component builds an agent that communicates exclusively in structured JSON, connecting
    a language model with a set of tools to process user requests. You should always provide the `llm`
    input with a configured language model and connect at least one tool via `path` for the agent to function
    meaningfully. The `input_value` field carries the user''s request that the agent will act on. If the
    agent struggles with malformed or ambiguous input, enable `handle_parsing_errors` to let it attempt
    self-correction rather than failing outright. Use `max_iterations` to cap how many steps the agent
    takes before giving up — keep this value reasonable to avoid runaway loops or excessive API calls.
    Enabling `verbose` will surface more internal reasoning detail, which is useful during debugging.


    Be aware that `agent_description` is deprecated and only applies when this component is used in Tool
    Mode — avoid relying on it for new flows, as it will be removed in a future version. The component
    exposes two outputs: `response` gives you the final result for downstream use, while `agent` exposes
    the constructed agent object itself if you need to pass it elsewhere in the flow. Make sure your connected
    language model supports JSON-mode or structured output for best results.'
- type: LLMCheckerChainComponent
  guide: 'You help the user configure a self-verifying question-answering chain that runs an LLM twice
    — once to generate an answer and a second time to check and correct that answer before returning a
    final response.


    There are two inputs to configure. The `llm` input is the language model that powers both the generation
    and verification steps, so you should connect a capable, instruction-following model here; the quality
    of self-correction depends heavily on the model''s reasoning ability, and a weak model may fail to
    catch its own errors. The `input_value` is the question or statement you want the chain to process
    — this is typically wired from an earlier node in your flow, such as a chat input or text field. The
    component produces a single text output containing the verified answer. Keep in mind that because
    the chain makes at least two LLM calls internally, latency and token costs will be roughly double
    compared to a single-pass chain, and the model must be strong enough to critically evaluate its own
    prior output for this pattern to add value.'
- type: LLMMathChainComponent
  guide: 'You help the user configure a component that takes a natural-language math question, uses a
    language model to interpret it, generates Python code to solve it, executes that code, and returns
    the numeric result as text. The two inputs work together: `llm` is where the user connects a language
    model node — this is required, as the chain relies on the model to translate the question into executable
    Python, so an incompatible or missing model will cause the chain to fail. The `input_value` is the
    math problem or expression stated in plain language, such as "What is the square root of 144 times
    37?" — it does not need to be formatted as code or a formula. Because this component actually executes
    generated Python, the results are precise numeric calculations rather than model-estimated answers,
    but keep in mind the model must correctly interpret ambiguous phrasing before any calculation occurs.
    Stick to mathematical queries; passing unrelated text may produce errors or nonsensical output since
    the chain expects something it can translate into a Python math expression.'
- type: LangChainHubPromptComponent
  guide: 'This component fetches a hosted prompt template from LangChain Hub and makes it available as
    a prompt output for downstream nodes in your flow. You help the user supply two required values: their
    LangChain API key, which authenticates access to the Hub, and the prompt handle — a string in the
    form `owner/prompt-name` (for example, `efriis/my-first-prompt`) that identifies exactly which published
    prompt to pull. If the user is unsure of their handle, they should log in to smith.langchain.com and
    copy it from the prompt''s detail page. Keep in mind that the prompt retrieved is defined entirely
    by whoever published it on the Hub, so the variables it exposes and its structure are fixed remotely
    — you cannot modify the template itself here. If the fetched prompt expects specific input variables,
    those must be satisfied by nodes connected upstream. Any typo in the handle or an invalid or missing
    API key will cause the fetch to fail at runtime, so confirm both values are exact before the user
    runs the flow.'
- type: LanguageRecursiveTextSplitterComponent
  guide: 'This component splits input text into chunks using language-aware recursive splitting rules,
    making it especially well-suited for structured content like source code or prose with predictable
    syntax boundaries.


    You help the user configure four inputs. `data_input` is where the text or documents to be split are
    connected — this is typically the output of a loader or another text-producing component. `code_language`
    tells the splitter which language''s syntax to respect when choosing where to break the text; selecting
    the correct language ensures splits happen at natural boundaries (such as function definitions or
    paragraphs) rather than mid-token. `chunk_size` sets the maximum character length of each resulting
    chunk, so increase it if downstream components need more context and decrease it if they have strict
    token limits. `chunk_overlap` controls how many characters are repeated between consecutive chunks,
    which helps preserve context across boundaries — a value of zero means no overlap, while higher values
    reduce the risk of cutting off important context but increase total data volume. Note that `chunk_overlap`
    should always be smaller than `chunk_size`, as an overlap equal to or larger than the chunk size would
    create redundant or infinite splitting behavior.'
- type: NaturalLanguageTextSplitterComponent
  guide: 'This component splits input text into smaller chunks by respecting natural language boundaries
    — such as sentences and paragraphs — rather than cutting at arbitrary character positions, using language-aware
    tokenization under the hood.


    You help the user configure five inputs. The `data_input` field receives the text to be processed,
    and `language` should match the language of that text — getting this right ensures boundary detection
    works correctly, so change it away from the default "English" whenever the source text is in another
    language. The `separator` defines what character sequence the splitter uses to divide text; it defaults
    to a double newline (`\n\n`) when left blank, which works well for paragraph-structured content, but
    you can supply any delimiter that better suits the source format. The `chunk_size` sets the maximum
    character count per output chunk, and `chunk_overlap` controls how many characters are shared between
    consecutive chunks — overlapping chunks help preserve context across boundaries, so a higher overlap
    reduces information loss at the cost of redundancy. Note that `chunk_size` is a character limit, not
    a word or token limit, so factor that in when targeting downstream models with token-based constraints.'
- type: OpenAIToolsAgentComponent
  guide: You help the user configure an agent that connects an OpenAI-compatible language model to a set
    of tools, allowing it to reason and act across multiple steps to fulfill a request. The core inputs
    to focus on are **tools** (the capabilities the agent can invoke), **input_value** (the user's request
    being processed), and **model** (either a selected provider or a connected Language Model component,
    paired with an **api_key**). Shape the agent's behavior through **system_prompt**, which sets its
    overall persona and instructions, and **user_prompt**, which must include the placeholder `{input}`
    — omitting this key will cause an error. Use **max_iterations** to cap how many reasoning steps the
    agent attempts before stopping, which helps prevent runaway loops on complex or ambiguous tasks. Turn
    on **handle_parsing_errors** if the agent frequently fails to interpret responses correctly, and enable
    **verbose** for detailed logging during development. **chat_history** lets you pass prior conversation
    turns for multi-turn interactions. Note that **agent_description** is deprecated and only applies
    in Tool Mode — avoid relying on it for new configurations, as it will be removed in a future version.
- type: OpenAPIAgentComponent
  guide: 'This component runs an agent that uses an OpenAPI specification to interact with external APIs,
    routing user requests through the appropriate endpoints defined in that spec. You help the user configure
    the inputs that control both how the agent reasons and how it connects to the target API.


    Start with the essentials: connect a language model via the model input or provide an API key directly.
    Point the agent at an OpenAPI spec file using the path input — this defines which API operations the
    agent can call. The input_value field is the user''s request the agent will attempt to fulfill. If
    the agent struggles to interpret ambiguous or malformed input, enabling handle_parsing_errors will
    let it recover gracefully rather than fail outright. Use max_iterations to cap how many steps the
    agent takes before giving up, which is important for preventing runaway execution against live APIs.
    The allow_dangerous_requests input should be treated carefully — enabling it permits the agent to
    make potentially destructive or side-effecting API calls, so only turn it on when you trust both the
    spec and the user''s intent. The agent_description input is deprecated and only relevant in Tool Mode,
    so you should generally leave it alone. The verbose input can help with debugging but has no effect
    on the agent''s output.'
- type: RecursiveCharacterTextSplitterComponent
  guide: 'You help the user configure a component that breaks large bodies of text into smaller, overlapping
    pieces while trying to preserve semantically related content within the same chunk. The core inputs
    to tune are `chunk_size` and `chunk_overlap`: `chunk_size` sets the maximum character length of each
    resulting chunk, so lower values produce more, smaller pieces while higher values keep more text together;
    `chunk_overlap` controls how many characters are repeated between consecutive chunks, which helps
    prevent context from being lost at boundaries — a value of zero means no repetition, while larger
    values increase redundancy but improve continuity. Connect the text or documents you want split to
    `data_input`. The `separators` field lets you define an ordered list of characters the splitter will
    try first (e.g., `"\n\n"` before `"\n"` before `" "`); if you leave it empty, it falls back to the
    default sequence of paragraph breaks, line breaks, spaces, and empty string. Be aware that `chunk_overlap`
    must be smaller than `chunk_size`, and that very large overlap values relative to chunk size can cause
    excessive repetition or unexpected behavior downstream.'
- type: RetrievalQAComponent
  guide: You help the user configure a question-answering pipeline that takes a query, fetches relevant
    context from a retriever, and passes everything to a language model to produce a grounded answer.
    The `input_value` field holds the actual question or prompt the chain will process, so it should be
    the text string you want answered. Connect a retriever to `retriever` — this is what performs the
    underlying document lookup — and connect a language model to `llm` to handle response generation.
    The `chain_type` setting controls how retrieved documents are combined before being sent to the model;
    common options like "stuff," "map_reduce," or "refine" trade off between simplicity and handling larger
    document sets, so choose based on how much content your retriever typically returns. Optionally attach
    a `memory` object if you want the chain to retain conversational history across turns. Toggle `return_source_documents`
    on if you need the output to include the documents used to generate the answer, which is useful for
    citation or debugging purposes — leave it off if you only need the final text response. Note that
    all output is routed through a single text output, so if you enable source documents, be aware of
    how the downstream component will parse that combined response.
- type: RunnableExecComponent
  guide: You help the user configure a component that takes a LangChain runnable object and invokes it
    with a provided input, producing a text output. The core connection is between `runnable` (the chain,
    prompt, or other runnable object passed in from upstream) and `input_value` (the data you want to
    send into it). By default, the component tries to automatically detect the correct `input_key` and
    `output_key` from the runnable's schema, so you often don't need to touch those fields — but if the
    runnable has multiple input or output keys and the auto-detection picks the wrong one, you should
    set `input_key` and `output_key` explicitly to the exact key names the runnable expects and returns.
    Enable `use_stream` if you want the runnable's output to be streamed token-by-token rather than returned
    all at once; note that not every runnable supports streaming, so enabling this on an incompatible
    runnable may cause errors. Keep in mind this component always produces a single text output, so runnables
    that return complex structured objects may have their output truncated or misrepresented if the detected
    output key doesn't point to a plain text field.
- type: SQLAgentComponent
  guide: This component builds an SQL agent that connects a language model to a database, allowing it
    to interpret natural language questions and execute queries against a SQL database. You should always
    provide a valid connection string in the database URI field (e.g., `sqlite:///mydb.db` or a PostgreSQL
    URI) and supply either an API key or a connected Language Model component via the model input — without
    both, the agent cannot function. Set `input_value` to the user's question or task at runtime. If the
    agent struggles to interpret ambiguous inputs, enable `handle_parsing_errors` to allow it to recover
    gracefully rather than failing outright. Use `max_iterations` to cap how many reasoning steps the
    agent takes, which helps prevent runaway costs or infinite loops on complex queries. The `verbose`
    flag can help during development by surfacing the agent's internal reasoning. You can attach additional
    tools via `extra_tools` if you need the agent to do more than query the database. Avoid relying on
    `agent_description`, as it is deprecated and will be removed in a future version — its effect is limited
    to Tool Mode and not central to standard SQL agent behavior.
- type: SQLDatabaseComponent
  guide: 'You help the user connect a SQL database to their flow by configuring a single connection string.
    The component takes one input — the database URI — and produces an SQLDatabase object that downstream
    components can use to run queries or inspect schema. The URI should follow standard database connection
    string conventions, for example `sqlite:///mydb.db` for SQLite, `postgresql://user:password@host:port/dbname`
    for PostgreSQL, or the equivalent format for MySQL, MSSQL, and other supported backends.


    Make sure the user provides a complete and valid URI, since there are no separate fields for host,
    port, username, or password — everything must be encoded in that single string. Remind them to handle
    sensitive credentials carefully and avoid hardcoding passwords in shared flows; environment variables
    or secret managers are a safer approach. If the user encounters connection errors, the most common
    causes are a malformed URI, incorrect credentials, a database server that is not reachable from the
    runtime environment, or a missing driver library for their chosen database backend.'
- type: SQLGeneratorComponent
  guide: 'This component takes a plain-language question and converts it into a runnable SQL query by
    combining a language model, a database connection, and a guiding prompt. You help the user wire up
    and tune five inputs: `input_value` is the natural-language question the user wants answered; `llm`
    is the language model that will do the translation, so connect a configured LLM node here; and `db`
    is the database connection the model will inspect for schema context — without it the component cannot
    generate accurate queries. The `top_k` input controls how many rows each SELECT statement is allowed
    to return, which is useful for limiting runaway queries on large tables, so lower this if you are
    concerned about performance or cost. Finally, `prompt` lets you customize the instructions sent to
    the model, but be careful: it must contain the placeholder `{question}` exactly as written, or the
    component will fail to inject the user''s input. The output is a text string containing the generated
    SQL. If results look wrong, guide the user to refine the prompt or verify that the database connection
    exposes the correct schema.'
- type: SelfQueryRetrieverComponent
  guide: 'You help the user configure a retriever that combines a vector store with an LLM to automatically
    translate a natural-language query into both a semantic search and structured metadata filters in
    a single step. The `query` input is the user''s natural-language question or search string that the
    LLM will interpret. The `vectorstore` input must point to a vector store already populated with embedded
    documents. The `llm` input specifies which language model performs the query translation, so choosing
    a more capable model generally improves filter accuracy. The `document_content_description` input
    should be a brief plain-text description of what the documents in the store contain — this gives the
    LLM context to understand what semantic content to search for. The `attribute_infos` input defines
    the metadata fields the LLM is allowed to filter on; each entry should describe a field name, its
    type, and what it represents.


    A key gotcha: the metadata fields listed in `attribute_infos` must actually exist in the documents
    stored in the vector store — mismatches will cause filters to silently fail or return empty results.
    Similarly, the `document_content_description` should accurately reflect the corpus, because a vague
    or misleading description degrades the LLM''s ability to generate useful queries. The component outputs
    a list of matching documents.'
- type: SemanticTextSplitterComponent
  guide: 'You help the user configure a component that splits input text into chunks based on semantic
    similarity between sentences, rather than fixed character or token counts. The core inputs to get
    right are `data_inputs` — the list of Data objects whose text will be split — and `embeddings`, which
    is required and determines how semantic similarity is measured; without a connected embeddings model
    the component will not function. The `breakpoint_threshold_type` controls the statistical method used
    to decide where one chunk ends and the next begins: "percentile" cuts based on a distribution percentile
    across all similarity scores, "standard_deviation" uses spread from the mean, and "interquartile"
    uses the middle range of scores. Pair that with `breakpoint_threshold_amount` to tune how aggressively
    boundaries are drawn — lower values create fewer, larger chunks, while higher values produce more,
    smaller ones. If you set `number_of_chunks` instead, the splitter targets a fixed chunk count directly,
    which may override threshold-based splitting. The optional `sentence_split_regex` lets you customize
    how raw text is first divided into sentences before similarity is evaluated, and `buffer_size` controls
    how many surrounding sentences are grouped together when computing similarity, so increasing it smooths
    boundaries at the cost of granularity.'
- type: SpiderTool
  guide: 'You help the user configure a web crawling and scraping tool that fetches content from one or
    more pages using the Spider API. Start by ensuring the user has provided a valid API key from spider.cloud
    and a target URL. The `mode` input determines the core behavior: choose `scrape` to extract content
    from a single page, or `crawl` to follow links across an entire site. When crawling, `limit` caps
    the total number of pages visited (set it to 0 for no cap, but use this carefully to avoid runaway
    requests), and `depth` controls how many link-levels deep the crawler will go (0 means unlimited).
    Use `blacklist` and `whitelist` to narrow crawl scope with regex patterns — note that if `whitelist`
    is set, all paths not matching it are ignored, so these two inputs can conflict if used carelessly
    together. Enable `readability` if the user wants cleaner, reader-friendly text output rather than
    raw HTML. Adjust `request_timeout` if the target site is slow. If the user provides values through
    the `params` input, be aware that all other individual inputs are ignored entirely — `params` is an
    all-or-nothing override meant for advanced API usage. The component outputs a single `content` result.'
- type: ToolCallingAgentComponent
  guide: You help the user configure an agent that routes tasks through connected tools, using a language
    model to decide which tool to call and when. The most essential inputs to set up first are `model`
    (either choose a provider directly or wire in a Language Model component) and `api_key` if the chosen
    provider requires one, followed by `tools`, which defines what capabilities the agent can actually
    invoke — without at least one tool connected, the agent has little reason to exist. The `input_value`
    field carries the user's request into the agent at runtime, while `system_prompt` lets you shape the
    agent's overall behavior and tone. Use `chat_history` if the agent needs to maintain context across
    multiple turns. For reliability, keep `handle_parsing_errors` enabled so the agent can recover gracefully
    from malformed outputs rather than failing outright. Raise `max_iterations` if your tasks involve
    chained tool calls, but be mindful that higher values increase latency and cost. The `agent_description`
    field is marked deprecated — avoid relying on it for new configurations, as it will be removed in
    a future release. The `verbose` toggle can help during debugging but adds noise in production.
- type: VectorStoreInfoComponent
  guide: 'You help the user document and pass along metadata about a vector store instance within their
    flow. This component takes an existing vector store object via the `input_vectorstore` field and pairs
    it with two descriptive fields — `vectorstore_name` and `vectorstore_description` — so that downstream
    components can identify or log which store is in use. The `vectorstore_name` should be a short, unique
    label that distinguishes this store from others in the flow, while `vectorstore_description` should
    provide enough context for anyone reading the flow to understand what data the store contains or its
    intended purpose.


    Keep in mind that neither the name nor the description affects how the vector store actually behaves;
    they are purely informational. If you leave those fields blank, the output will still carry the connected
    store object, but without any human-readable context attached. Make sure the `input_vectorstore` connection
    is wired to a valid vector store component upstream — without it, the output will lack a usable store
    regardless of what you enter in the text fields.'
- type: VectorStoreRouterAgentComponent
  guide: This component builds an agent that routes user queries across one or more vector stores, using
    a language model to decide which store to consult and returning a synthesized response. To configure
    it, provide the user's question in `input_value` and connect a language model to `llm` — without these
    two the agent cannot run. Connect one or more vector stores to `vectorstores`; the agent will use
    them as its retrieval tools and route between them based on query relevance. Use `max_iterations`
    to cap how many reasoning steps the agent attempts before giving up, which helps prevent runaway loops
    on ambiguous queries. Enable `handle_parsing_errors` if the agent frequently fails to interpret its
    own tool outputs correctly. The `verbose` flag surfaces internal reasoning steps, useful for debugging
    but noisy in production. Avoid relying on `agent_description` for anything critical — it applies only
    in Tool Mode, defaults to a generic string, and is explicitly deprecated, meaning it may disappear
    in a future release. Keep configuration focused on the LLM, vector store connections, and iteration
    limits for reliable behavior.
- type: XMLAgentComponent
  guide: This component runs an agent that communicates tool-use instructions to a language model using
    XML formatting, which certain models parse more reliably than other structured formats. You help the
    user connect at least one tool via the tools input and supply the user's request through input_value.
    The model input accepts either a direct API-connected provider or a Language Model component, and
    you'll need a valid api_key if credentials aren't already embedded in that component. Adjust system_prompt
    to shape the agent's overall behavior and persona; note that user_prompt must include the placeholder
    key "input" or the component will fail. The chat_history input can be wired in to give the agent conversational
    context across turns. Turn on handle_parsing_errors if the agent struggles to interpret ambiguous
    or malformed input, and increase max_iterations if tasks are complex enough to require more reasoning
    steps — but keep it bounded to avoid runaway loops. The verbose flag emits detailed internal reasoning
    to logs, useful for debugging. Avoid relying on agent_description for anything critical, as it is
    deprecated and scheduled for removal; use system_prompt instead to describe the agent's role and available
    tools.
